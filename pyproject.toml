[project]
name = "agent-smith"
version = "0.1.0"
description = "A code-writing LLM agent with a process-isolated sandbox, MCP tools, and a multi-provider LLM layer — no agent framework."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.26,<2",
    "pydantic>=2.14.2",
]

[project.scripts]
sandbox = "agent_smith.sandbox.cli:main"
agent-mbpp = "agent_mbpp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_smith", "agent_mbpp"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
