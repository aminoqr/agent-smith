[project]
name = "agent-smith"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pydantic>=2.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_smith"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
